name: kkotsuni-cockpit-v2
services:
  app:
    build:
      context: ..
      dockerfile: v2/Dockerfile
    image: kkotsuni-cockpit-v2:local
    ports:
      - "127.0.0.1:8512:8510"
    environment:
      V2_SQLITE_PATH: /app/data/kkotsuni_v2_demo.db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
      COCKPIT_ACCESS_TOKEN: ${COCKPIT_ACCESS_TOKEN:-}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime-2.1}
      OPENAI_REALTIME_VOICE: ${OPENAI_REALTIME_VOICE:-marin}
    volumes:
      - kkotsuni_v2_data:/app/data
    restart: unless-stopped
volumes:
  kkotsuni_v2_data:
